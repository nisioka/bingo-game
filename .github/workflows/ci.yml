name: CI

on:
  push:
    branches:
      - master
      - 'claude/**'
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies 📦
        run: pnpm install --frozen-lockfile

      - name: Run tests 🧪
        # With CI=true, react-scripts runs the test suite once and exits.
        run: pnpm test
        env:
          CI: true

      - name: Build 🏗️
        run: pnpm run build
        env:
          CI: false
